<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <nav>
            <a href="index.html">Home (Patient)</a>
            <a href="admin_login.html">Logout</a>
        </nav>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <div class="dashboard-box" id="hospitalsBox">
                <h3>Manage Hospitals</h3>
            </div>
            <div class="dashboard-box" id="departmentsBox">
                <h3>Manage Departments</h3>
            </div>
            <div class="dashboard-box" id="doctorsBox">
                <h3>Manage Doctors</h3>
            </div>
            <div class="dashboard-box" id="patientsBox">
                <h3>Manage Patients</h3>
            </div>
        </div>

        <div id="hospitalsList" class="list-container" style="display:none;">
            <h2>Hospitals List</h2>
            <ul id="hospitalsUl">
                </ul>
        </div>

        <div id="departmentsList" class="list-container" style="display:none;">
            <h2>Departments List</h2>
            <ul id="departmentsUl">
                </ul>
        </div>

        <div id="doctorsList" class="list-container" style="display:none;">
            <h2>Doctors List</h2>
            <ul id="doctorsUl">
                </ul>
        </div>

        <div id="patientsList" class="list-container" style="display:none;">
            <h2>Patients List</h2>
            <ul id="patientsUl">
                </ul>
        </div>
    </main>

    <script src="admin_dashboard.js"></script>
</body>
</html>
